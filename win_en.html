<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Victory!</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  body {
    background: #000000;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding-top: 120px;   /* רווח גדול למעלה */
    padding-bottom: 120px;/* רווח גדול למטה */
    margin: 0;
    overflow: hidden;
  }

  img.logo {
    width: 1000px; /* פי 2 */
    margin-bottom: 80px;
  }

  .title-line1 {
    font-size: 128px; /* פי 2 */
    font-weight: 800;
    color: #ffffff;
    margin: 0;
  }

  .title-line2 {
    font-size: 88px; /* פי 2 */
    font-weight: 400;
    color: #ffffff;
    margin-top: 28px;
    margin-bottom: 140px;
  }

  .btn {
    width: 760px;      /* פי 2 */
    padding: 68px;     /* פי 2 */
    margin: 44px auto; /* פי 2 */
    font-size: 68px;   /* פי 2 */
    font-weight: 600;
    border: none;
    border-radius: 48px; /* פי 2 */
    cursor: pointer;
    transition: 0.2s;
    display: block;
  }

  #resetBtn {
    background: #238636;
    color: white;
  }
  #resetBtn:hover {
    background: #2ea043;
  }

  #langBtn {
    background: #7d4cff;
    color: white;
  }
  #langBtn:hover {
    background: #6b3dff;
  }

  .spark {
    position: absolute;
    width: 40px;      /* פי 2 */
    height: 40px;     /* פי 2 */
    background: #ffcc00;
    border-radius: 50%;
    animation: explode 2.6s infinite ease-out;
    opacity: 0.95;
    box-shadow: 0 0 28px #ffcc00; /* פי 2 */
  }

  @keyframes explode {
    0% {
      transform: translate(0,0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) scale(0);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<img class="logo" src="images/logo.png" alt="Sablander">

<h1 class="title-line1">You Won!</h1>
<h2 class="title-line2">All levels solved</h2>

<button class="btn" id="resetBtn">Reset Game</button>
<button class="btn" id="langBtn">Switch Language</button>

<script>
document.getElementById("resetBtn").onclick = () => {
  localStorage.removeItem("blender_solvedLevels");
  window.location.replace("index.html");
};

document.getElementById("langBtn").onclick = () => {
  localStorage.setItem("blender_lang", "he");
  window.location.replace("win_he.html");
};

function createSpark() {
  const spark = document.createElement("div");
  spark.classList.add("spark");

  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;

  spark.style.left = x + "px";
  spark.style.top = y + "px";

  const dx = (Math.random() - 0.5) * 1200; /* פי 2 */
  const dy = (Math.random() - 0.5) * 1200;

  spark.style.setProperty("--dx", dx + "px");
  spark.style.setProperty("--dy", dy + "px");

  document.body.appendChild(spark);

  setTimeout(() => spark.remove(), 2600);
}

setInterval(createSpark, 90); /* קצת יותר זיקוקים */
</script>

</body>
</html>
