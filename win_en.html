<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Victory!</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  body {
    background: #0d1117;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding-top: 40px;
    margin: 0;
    overflow: hidden;
  }

  /* Logo */
  img.logo {
    width: 330px; /* פי 1.5 בערך */
    margin-bottom: 40px;
  }

  /* Title */
  .title-line1 {
    font-size: 48px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
  }

  .title-line2 {
    font-size: 32px;
    font-weight: 400;
    color: #ffffff;
    margin-top: 10px;
    margin-bottom: 50px;
  }

  /* Buttons */
  .btn {
    width: 300px;
    padding: 24px;
    margin: 14px;
    font-size: 26px; /* מוגדל */
    font-weight: 600;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.2s;
  }

  #resetBtn {
    background: #238636;
    color: white;
  }
  #resetBtn:hover {
    background: #2ea043;
  }

  #langBtn {
    background: #7d4cff;
    color: white;
  }
  #langBtn:hover {
    background: #6b3dff;
  }

  /* Fireworks Animation */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #ffcc00;
    border-radius: 50%;
    animation: explode 1.6s infinite ease-out;
    opacity: 0.8;
  }

  @keyframes explode {
    0% {
      transform: translate(0,0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) scale(0);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<img class="logo" src="images/logo.png" alt="Sablander">

<h1 class="title-line1">You Won!</h1>
<h2 class="title-line2">All levels solved</h2>

<button class="btn" id="resetBtn">Reset Game</button>
<button class="btn" id="langBtn">Switch Language</button>

<script>
/* Buttons */
document.getElementById("resetBtn").onclick = () => {
  localStorage.removeItem("blender_solvedLevels");
  window.location.replace("index.html");
};

document.getElementById("langBtn").onclick = () => {
  localStorage.setItem("blender_lang", "he");
  window.location.replace("win_he.html");
};

/* Fireworks generator */
function createSpark() {
  const spark = document.createElement("div");
  spark.classList.add("spark");

  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;

  spark.style.left = x + "px";
  spark.style.top = y + "px";

  const dx = (Math.random() - 0.5) * 200;
  const dy = (Math.random() - 0.5) * 200;

  spark.style.setProperty("--dx", dx + "px");
  spark.style.setProperty("--dy", dy + "px");

  document.body.appendChild(spark);

  setTimeout(() => spark.remove(), 1600);
}

setInterval(createSpark, 180);
</script>

</body>
</html>
