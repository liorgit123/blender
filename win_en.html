<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You Won!</title>

  <link rel="stylesheet" href="styles.css?v=12">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* Fireworks ALWAYS on top */
    #fireworks-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
    }

    .spark {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #ffcc00;
      border-radius: 50%;
      animation: explode 2.6s ease-out forwards;
      opacity: 0.95;
      box-shadow: 0 0 20px #ffcc00;
    }

    @keyframes explode {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* Full-screen centered content */
    .win-dialog {
      position: fixed;
      inset: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .win-content {
      text-align: center;
      padding: 20px;
      margin: 0 auto;
      font-family: 'Inter', sans-serif; /* English font */
    }

    .win-content h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .win-content p {
      font-size: 1.4rem;
      margin-bottom: 30px;
      color: #b8d4ff;
    }

    .win-content button {
      display: block;
      width: 240px;
      margin: 10px auto;
      padding: 15px;
      background: #6e75ff;
      border-radius: 16px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      font-family: 'Inter', sans-serif; /* ensure English font */
    }

    #resetBtn {
      background: #238636;
    }

    #langBtn {
      background: #7d4cff;
    }

    /* Center logo */
    .win-content .logo {
      display: block;
      margin: 0 auto 24px auto;
      max-width: 200px;
    }
  </style>
</head>

<body>

  <!-- Fireworks layer on top -->
  <div id="fireworks-layer"></div>

  <!-- Centered win dialog -->
  <div class="win-dialog">
    <div class="win-content">

      <img class="logo" src="images/logo.png" alt="Sablander">

      <h2>You Won!</h2>
      <p>All levels solved</p>

      <button id="resetBtn">Reset Progress</button>
      <button id="langBtn">Switch Language</button>

    </div>
  </div>

  <script>
    document.getElementById("resetBtn").onclick = () => {
      localStorage.removeItem("solvedLevels");
      window.location.replace("index.html");
    };

    document.getElementById("langBtn").onclick = () => {
      localStorage.setItem("gameLanguage", "he");
      window.location.replace("index.html");
    };

    function createSpark() {
      const spark = document.createElement("div");
      spark.classList.add("spark");

      const layer = document.getElementById("fireworks-layer");
      const rect = layer.getBoundingClientRect();

      const x = Math.random() * rect.width;
      const y = Math.random() * rect.height;

      spark.style.left = x + "px";
      spark.style.top = y + "px";

      const dx = (Math.random() - 0.5) * 300;
      const dy = (Math.random() - 0.5) * 300;

      spark.style.setProperty("--dx", dx + "px");
      spark.style.setProperty("--dy", dy + "px");

      layer.appendChild(spark);

      setTimeout(() => spark.remove(), 2600);
    }

    setInterval(createSpark, 90);
  </script>

</body>
</html>
