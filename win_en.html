<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Victory!</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  body {
    background: #000000;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding-top: 120px;
    padding-bottom: 120px;
    margin: 0;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* Fireworks layer */
  #fireworks-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  img.logo {
    width: 700px;
    margin-bottom: 56px;
  }

  .title-line1 {
    font-size: 90px;
    font-weight: 800;
    margin: 0;
  }

  .title-line2 {
    font-size: 62px;
    font-weight: 400;
    margin-top: 20px;
    margin-bottom: 98px;
  }

  .btn {
    width: 532px;
    padding: 48px;
    margin: 30px auto;
    font-size: 60px;
    font-weight: 400;
    border: none;
    border-radius: 34px;
    cursor: pointer;
    transition: 0.2s;
    display: block;
  }

  #resetBtn {
    background: #238636;
    color: white;
  }
  #resetBtn:hover {
    background: #2ea043;
  }

  #langBtn {
    background: #7d4cff;
    color: white;
  }
  #langBtn:hover {
    background: #6b3dff;
  }

  .spark {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #ffcc00;
    border-radius: 50%;
    animation: explode 2.6s ease-out forwards;
    opacity: 0.95;
    box-shadow: 0 0 20px #ffcc00;
  }

  @keyframes explode {
    0% {
      transform: translate(0,0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) scale(0);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div id="fireworks-layer"></div>

<img class="logo" src="images/logo.png" alt="Sablander">

<h1 class="title-line1">You Won!</h1>
<h2 class="title-line2">All levels solved</h2>

<button class="btn" id="resetBtn">Reset progress</button>
<button class="btn" id="langBtn">Switch language</button>

<script>
document.getElementById("resetBtn").onclick = () => {
  localStorage.removeItem("blender_solvedLevels");
  window.location.replace("index.html");
};

document.getElementById("langBtn").onclick = () => {
  localStorage.setItem("blender_lang", "he");
  window.location.replace("win_he.html");
};

function createSpark() {
  const spark = document.createElement("div");
  spark.classList.add("spark");

  const layer = document.getElementById("fireworks-layer");

  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;

  spark.style.left = x + "px";
  spark.style.top = y + "px";

  const dx = (Math.random() - 0.5) * 840;
  const dy = (Math.random() - 0.5) * 840;

  spark.style.setProperty("--dx", dx + "px");
  spark.style.setProperty("--dy", dy + "px");

  layer.appendChild(spark);

  setTimeout(() => spark.remove(), 2600);
}

setInterval(createSpark, 90);
</script>

</body>
</html>
