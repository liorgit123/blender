<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swipe to Reveal Clue</title>
<style>
  body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    padding: 2rem;
  }

  .clue-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 520px;
  }

  .clue-label {
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Thin pill slider */
  .pill {
    position: relative;
    flex: 1;
    height: 32px;
    background: #111827;
    border-radius: 999px;
    overflow: hidden;
    user-select: none;
  }

  .pill-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    font-size: 0.8rem;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .pill-label .arrow {
    margin-right: 0.35rem;
    font-size: 0.9rem;
  }

  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 26px;
    height: 26px;
    background: #22c55e;
    border-radius: 999px;
    cursor: grab;
    transition: background 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #022c22;
  }

  .knob:active {
    cursor: grabbing;
    background: #16a34a;
  }

  /* Revealed clue text (same line, appears after swipe) */
  .clue-text {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .clue-text.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="clue-row">
  <div class="clue-label">Clue:</div>

  <!-- Swipe pill -->
  <div class="pill" id="pill">
    <div class="pill-label" id="pillLabel">
      <span class="arrow">➜</span> Swipe to reveal
    </div>
    <div class="knob" id="knob">⇆</div>
  </div>
</div>

<div class="clue-text" id="clueText">
  A famous sci-fi movie about dreams.
</div>

<script>
  const knob = document.getElementById('knob');
  const pill = document.getElementById('pill');
  const clueText = document.getElementById('clueText');
  const pillLabel = document.getElementById('pillLabel');

  let dragging = false;
  let startX = 0;

  function startDrag(clientX) {
    dragging = true;
    startX = clientX - knob.offsetLeft;
  }

  function endDrag() {
    dragging = false;
  }

  function moveKnob(clientX) {
    if (!dragging) return;

    const pillRect = pill.getBoundingClientRect();
    let newLeft = clientX - startX;

    const maxLeft = pillRect.width - knob.offsetWidth - 3;
    newLeft = Math.max(3, Math.min(newLeft, maxLeft));

    knob.style.left = newLeft + 'px';

    const progress = newLeft / maxLeft;
    pillLabel.style.opacity = 1 - progress;

    if (progress >= 0.98) {
      clueText.classList.add('visible');
    }
  }

  // Mouse events
  knob.addEventListener('mousedown', (e) => {
    startDrag(e.clientX);
  });

  document.addEventListener('mouseup', endDrag);
  document.addEventListener('mousemove', (e) => moveKnob(e.clientX));

  // Touch events
  knob.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    startDrag(touch.clientX);
  }, { passive: true });

  document.addEventListener('touchend', endDrag);
  document.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    moveKnob(touch.clientX);
  }, { passive: true });
</script>

</body>
</html>
