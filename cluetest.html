<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swipe to Reveal</title>
<style>
  body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: system-ui, sans-serif;
    padding: 2rem;
  }

  .section {
    background: #1f2937;
    padding: 1.5rem;
    border-radius: 0.75rem;
    border: 1px solid #374151;
    max-width: 420px;
  }

  .pill {
    position: relative;
    width: 100%;
    height: 48px;
    background: #111827;
    border-radius: 999px;
    overflow: hidden;
    user-select: none;
  }

  .pill-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    font-size: 0.85rem;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .knob {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 40px;
    height: 40px;
    background: #22c55e;
    border-radius: 999px;
    cursor: grab;
    transition: background 0.2s ease;
  }

  .knob:active {
    cursor: grabbing;
    background: #16a34a;
  }

  .clue {
    margin-top: 1rem;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: #111827;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
  }

  .clue.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="section">
  <div class="pill" id="pill">
    <div class="pill-label" id="pillLabel">Swipe to reveal</div>
    <div class="knob" id="knob"></div>
  </div>

  <div class="clue" id="clue">
    A famous sci-fi movie about dreams.
  </div>
</div>

<script>
  const knob = document.getElementById('knob');
  const pill = document.getElementById('pill');
  const clue = document.getElementById('clue');
  const pillLabel = document.getElementById('pillLabel');

  let dragging = false;
  let startX = 0;

  knob.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX - knob.offsetLeft;
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;

    const pillRect = pill.getBoundingClientRect();
    let newLeft = e.clientX - startX;

    const maxLeft = pillRect.width - knob.offsetWidth - 4;
    newLeft = Math.max(4, Math.min(newLeft, maxLeft));

    knob.style.left = newLeft + 'px';

    const progress = newLeft / maxLeft;

    pillLabel.style.opacity = 1 - progress;

    if (progress >= 0.98) {
      clue.classList.add('visible');
    }
  });
</script>

</body>
</html>
