<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Milestone</title>
  <link rel="stylesheet" href="styles.css?v=100">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..700&display=swap" rel="stylesheet">
  <style>
    body {
      align-items: center;
      background: radial-gradient(circle at center, #071b1b 0, #000 62%);
    }

    .landmark-page {
      position: relative;
      width: min(100% - 32px, 420px);
      text-align: center;
    }

    .landmark-progress {
      --progress: 0%;
      width: 190px;
      height: 190px;
      margin: 0 auto 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      border-radius: 50%;
      background: conic-gradient(
        #1abc9c var(--progress),
        rgba(255, 255, 255, 0.28) var(--progress)
      );
      color: #fff;
      animation: landmarkRingIn 900ms ease-out both;
      overflow: hidden;
    }

    .landmark-progress::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: #05060a;
    }

    .landmark-progress-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      animation: landmarkTextIn 700ms ease-out both;
    }

    .landmark-percent {
      position: relative;
      top: -12px;
      font-size: 2rem;
      line-height: 1;
      display: block;
    }

    .landmark-total {
      position: relative;
      top: -12px;
      color: rgba(214, 226, 240, 0.9);
      font-size: 1rem;
      line-height: 1;
    }

    .landmark-coin-balance {
      position: relative;
      top: 10px;
      right: 0;
      transform: scale(1.5);
    }

    .landmark-message {
      margin: 0 auto 28px;
      color: #b8d4ff;
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      line-height: 1.3;
    }

    .landmark-button {
      display: inline-block;
      width: 130px;
      box-sizing: border-box;
      padding: 0.9rem 1.2rem;
      border: none;
      border-radius: 16px;
      color: #fff;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 400;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .landmark-continue {
      background: linear-gradient(160deg, #6e75ff 0%, #4a5ef0 100%);
      box-shadow: 0 8px 18px rgba(74, 94, 240, 0.35);
    }

    .landmark-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      visibility: hidden;
    }

    .landmark-actions.is-visible {
      visibility: visible;
    }

    .landmark-actions.is-visible .landmark-button {
      animation: landmarkButtonFadeIn 650ms ease-out both;
    }

    .landmark-actions.is-visible .landmark-button:nth-child(2) {
      animation-delay: 650ms;
    }

    .landmark-share {
      background: #238636;
      box-shadow: 0 8px 18px rgba(35, 134, 54, 0.35);
    }

    .landmark-share-status {
      min-height: 1.4em;
      margin: 10px 0 0;
      color: #9ce9d2;
      font-size: 0.95rem;
    }

    .landmark-button:hover {
      transform: translateY(-1px);
    }

    .landmark-continue:hover {
      box-shadow: 0 10px 20px rgba(74, 94, 240, 0.42);
    }

    .landmark-share:hover {
      box-shadow: 0 10px 20px rgba(35, 134, 54, 0.42);
    }

    @keyframes landmarkRingIn {
      0% {
        opacity: 0;
        transform: scale(0.86);
        box-shadow: 0 0 0 rgba(26, 188, 156, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 18px rgba(26, 188, 156, 0.35);
      }
    }

    @keyframes landmarkTextIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes landmarkButtonFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .landmark-progress,
      .landmark-progress strong,
      .landmark-total,
      .landmark-actions.is-visible .landmark-button {
        animation: none;
      }
    }
  </style>
</head>
<body dir="ltr">
  <main class="landmark-page">
    <div id="landmarkProgress" class="landmark-progress" aria-label="Progress milestone">
      <div class="landmark-progress-inner">
        <strong id="landmarkPercent" class="landmark-percent">0%</strong>
        <span id="landmarkTotal" class="landmark-total">0/0</span>
        <div id="landmarkCoinBalance" class="coin-balance landmark-coin-balance" aria-live="polite">
          <span class="coin-symbol" aria-hidden="true"></span>
          <span id="landmarkCoinAmount">0</span>
        </div>
      </div>
    </div>
    <p id="landmarkMessage" class="landmark-message"></p>
    <div class="landmark-actions">
      <button id="landmarkShare" class="landmark-button landmark-share" type="button">
        Share
      </button>
      <button id="landmarkContinue" class="landmark-button landmark-continue" type="button">
        Continue
      </button>
    </div>
    <p id="landmarkShareStatus" class="landmark-share-status" aria-live="polite"></p>
  </main>

  <script src="js/fireworks.js?v=224"></script>
  <script>
  const params = new URLSearchParams(window.location.search);
  const percentage = Number(params.get("percent"));
  const language = params.get("language") === "he" ? "he" : "en";
  const progressKey = "levelProgress";
  const coinsKey = "gameCoins";
  const progressEl = document.getElementById("landmarkProgress");
  const percentEl = document.getElementById("landmarkPercent");
  const totalEl = document.getElementById("landmarkTotal");
  const messageEl = document.getElementById("landmarkMessage");
  const coinAmountEl = document.getElementById("landmarkCoinAmount");
  const actionsEl = document.querySelector(".landmark-actions");
  const continueBtn = document.getElementById("landmarkContinue");
  const shareBtn = document.getElementById("landmarkShare");
  const shareStatusEl = document.getElementById("landmarkShareStatus");

  document.documentElement.lang = language;
  document.body.dir = language === "he" ? "rtl" : "ltr";
  continueBtn.textContent = language === "he" ? "המשך" : "Continue";
  shareBtn.textContent = language === "he" ? "שיתוף" : "Share";

  const coinsByLanguage = JSON.parse(localStorage.getItem(coinsKey) || "{}");
  const coinTotal = Number.isFinite(coinsByLanguage[language]) ? coinsByLanguage[language] : 50;
  coinAmountEl.textContent = String(coinTotal);

  messageEl.textContent = language === "he"
    ? `כל הכבוד - פתרת ${percentage}% מהשלבים!`
    : `Congratulations - you solved ${percentage}% of the levels!`;

  function animateProgress(solved, total) {
    const start = performance.now();
    const duration = 1800;
    const fireworksLeadTime = 750;
    let fireworksStarted = false;

    function frame(now) {
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      const currentPercent = Math.round(percentage * eased);
      progressEl.style.setProperty("--progress", `${currentPercent}%`);
      percentEl.textContent = `${currentPercent}%`;
      if (!fireworksStarted && now - start >= duration - fireworksLeadTime) {
        triggerFireworks("high");
        fireworksStarted = true;
      }
      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        totalEl.textContent = `${solved}/${total}`;
        actionsEl.classList.add("is-visible");
      }
    }

    requestAnimationFrame(frame);
  }

  async function initialize() {
    const fileName = language === "en" ? "questions-en.json?v=100" : "questions-he.json?v=100";
    const response = await fetch(`data/${fileName}`);
    const questions = await response.json();
    const levelProgress = JSON.parse(localStorage.getItem(progressKey) || "{}");
    const languageProgress = levelProgress[language] || {};
    const solved = questions.filter(question => languageProgress[question.id]?.is_solved).length;

    totalEl.textContent = `${solved}/${questions.length}`;
    animateProgress(solved, questions.length);
  }

  continueBtn.addEventListener("click", () => {
    localStorage.setItem("gameLanguage", language);
    window.location.replace("index.html");
  });

  shareBtn.addEventListener("click", async () => {
    const displayedPercent = Number.parseInt(percentEl.textContent, 10) || 0;

    const filledBlocks = Math.max(0, Math.min(10, Math.round(displayedPercent / 10)));
    const progressBar = `${"🟩".repeat(filledBlocks)}${"⬜".repeat(10 - filledBlocks)}`;

    const gameLink = "https://liorgit123.github.io/blender";

    const shareText = language === "he"
      ? `הגעתי ל־${percentEl.textContent} במשחק בלנדר! 🎉
${progressBar}
💰 צברתי כבר *${coinTotal}* מטבעות

מוזמנים לשחק:
${gameLink}`
      : `I reached ${percentEl.textContent} in Blender Word Game! 🎉
${progressBar}
💰 *${coinTotal}* coins collected

Try it yourself:
${gameLink}`;

    try {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(shareText);
      } else {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = shareText;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        const copied = document.execCommand("copy");
        temporaryInput.remove();
        if (!copied) throw new Error("Clipboard copy failed");
      }
      shareStatusEl.textContent = language === "he" ? "הועתק ללוח" : "Copied to clipboard";
    } catch {
      shareStatusEl.textContent = language === "he" ? "לא ניתן להעתיק ללוח" : "Could not copy to clipboard";
    }
  });

  initialize().catch(() => {
    totalEl.textContent = "0/0";
    animateProgress(0, 0);
  });
</script>
</body>
</html>
