<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניצחון!</title>

  <link rel="stylesheet" href="styles.css?v=99">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    /* Fireworks ALWAYS on top */
    #fireworks-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000; /* higher than everything */
    }

    .spark {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #ffcc00;
      border-radius: 50%;
      animation: explode 2.6s ease-out forwards;
      opacity: 0.95;
      box-shadow: 0 0 20px #ffcc00;
    }

    @keyframes explode {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* Full-screen centered content */
    body {
      background: #000;
    }

    .win-dialog {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .win-content {
      text-align: center;
      padding: 20px;
      margin: 0 auto;
    }

    .win-coin-balance {
      position: fixed;
      top: 24px;
      right: 24px;
      transform: scale(1.55);
      transform-origin: top right;
    }

    .win-content h2 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .win-content p {
      font-size: 1.4rem;
      margin-bottom: 30px;
      color: #b8d4ff;
    }

    .win-content button {
      display: block;
      width: 240px;
      margin: 10px auto;
      padding: 15px;
      background: #6e75ff;
      border-radius: 16px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
    }

    #resetBtn {
      background: #238636;
      box-shadow: none;
      font-family: 'Rubik', sans-serif;
    }

    #langBtn {
      background: #7d4cff;
      box-shadow: none;
      font-family: 'Rubik', sans-serif;
    }

    /* Make sure logo is centered with the content */
    .win-content .logo {
      display: block;
      margin: 0 auto 64px auto;
      max-width: 500px;
    }
  </style>
</head>

<body dir="rtl">

  <!-- Fireworks layer on top -->
  <div id="fireworks-layer"></div>

  <!-- Centered win dialog -->
  <div class="win-dialog">
    <div id="winCoinBalance" class="coin-balance win-coin-balance" aria-live="polite">
      <span class="coin-symbol" aria-hidden="true"></span>
      <span id="winCoinAmount">0</span>
    </div>

    <div class="win-content">

      <img class="logo" src="images/logo.png" alt="בלנדר">

      <h2>ניצחת!</h2>
      <p>כל השלבים נפתרו</p>

      <button id="resetBtn">איפוס התקדמות</button>
      <button id="langBtn">החלפת שפה</button>

    </div>
  </div>

  <script>
    const winCoins = JSON.parse(localStorage.getItem("gameCoins") || "{}");
    const winCoinAmount = Number.isFinite(winCoins.he) ? winCoins.he : 50;
    document.getElementById("winCoinAmount").textContent = String(winCoinAmount);

    document.getElementById("resetBtn").onclick = () => {
      resetProgress();
    };

    document.getElementById("langBtn").onclick = () => {
      localStorage.setItem("gameLanguage", "en");
      window.location.replace("index.html");
    };

    function createSpark() {
      const spark = document.createElement("div");
      spark.classList.add("spark");

      const layer = document.getElementById("fireworks-layer");
      const rect = layer.getBoundingClientRect();

      const x = Math.random() * rect.width;
      const y = Math.random() * rect.height;

      spark.style.left = x + "px";
      spark.style.top = y + "px";

      const dx = (Math.random() - 0.5) * 300;
      const dy = (Math.random() - 0.5) * 300;

      spark.style.setProperty("--dx", dx + "px");
      spark.style.setProperty("--dy", dy + "px");

      layer.appendChild(spark);

      setTimeout(() => spark.remove(), 2600);
    }

    function resetProgress() {
      const levelProgress = JSON.parse(localStorage.getItem("levelProgress") || "{}");
      const landmarkProgress = JSON.parse(localStorage.getItem("landmarkProgress") || "{}");
      delete levelProgress["he"];
      delete landmarkProgress["he"];
      localStorage.setItem("levelProgress", JSON.stringify(levelProgress));
      localStorage.setItem("landmarkProgress", JSON.stringify(landmarkProgress));
      window.location.replace("index.html");
    }

    setInterval(createSpark, 90);
  </script>

</body>
</html>
