<h1>Google Fonts — Hebrew + English</h1>

<div id="fonts"></div>

<script>

const fonts = [
  "Alef",
  "Amatic SC",
  "Arimo",
  "Assistant",
  "Bellefair",
  "Cardo",
  "Cascadia Code",
  "David Libre",
  "Frank Ruhl Libre",
  "Fredoka",
  "Gveret Levin",
  "Handjet",
  "Heebo",
  "Libertinus Serif",
  "M PLUS Rounded 1c",
  "Miriam Libre",
  "Noto Rashi Hebrew",
  "Noto Sans Hebrew",
  "Noto Serif Hebrew",
  "Open Sans Hebrew",
  "Playpen Sans Hebrew",
  "Secular One",
  "Solitreo",
  "Suez One",
  "Tinos",
  "Varela Round"
];

const container = document.getElementById("fonts");

fonts.forEach(font => {

  const block = document.createElement("div");
  block.className = "font";

  block.innerHTML = `
    <div class="font-name">
      שם הפונט: ${font}
    </div>

    <div class="row hebrew"
         style="font-family:'${font}', sans-serif; font-weight:400;">
      <span class="label">עברית רגיל:</span>
      אבגדהוזחטיכלמנסעפצקרשת
    </div>

    <div class="row hebrew"
         style="font-family:'${font}', sans-serif; font-weight:700;">
      <span class="label">עברית בולד:</span>
      אבגדהוזחטיכלמנסעפצקרשת
    </div>

    <div class="separator"></div>

    <div class="row english"
         style="font-family:'${font}', sans-serif; font-weight:400;">
      <span class="label">אנגלית רגיל:</span>
      ABCDEFGHIJKLMNOPQRSTUVWXYZ
    </div>

    <div class="row english"
         style="font-family:'${font}', sans-serif; font-weight:700;">
      <span class="label">אנגלית בולד:</span>
      ABCDEFGHIJKLMNOPQRSTUVWXYZ
    </div>
  `;

  container.appendChild(block);
});

</script>
