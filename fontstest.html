<body>

<h1>Rubik Fonts</h1>

<div id="fonts"></div>

<script>

const fonts = [
  "Rubik",
  "Rubik 80s Fade",
  "Rubik Beastly",
  "Rubik Broken Fax",
  "Rubik Bubbles",
  "Rubik Burned",
  "Rubik Dirt",
  "Rubik Distressed",
  "Rubik Doodle Shadow",
  "Rubik Doodle Triangles",
  "Rubik Gemstones",
  "Rubik Glitch",
  "Rubik Glitch Pop",
  "Rubik Iso",
  "Rubik Lines",
  "Rubik Maps",
  "Rubik Marker Hatch",
  "Rubik Maze",
  "Rubik Microbe",
  "Rubik Mono One",
  "Rubik Moonrocks",
  "Rubik One",
  "Rubik Pixels",
  "Rubik Puddles",
  "Rubik Scribble",
  "Rubik Spray Paint",
  "Rubik Storm",
  "Rubik Vinyl",
  "Rubik Wet Paint"
];

const container = document.getElementById("fonts");

fonts.forEach(font => {

  const block = document.createElement("div");
  block.className = "font";

  block.innerHTML = `
    <div class="font-name">
      שם הפונט: ${font}
    </div>

    <div class="row hebrew"
         style="font-family:'${font}', sans-serif; font-weight:400;">
      <span class="label">עברית רגיל:</span>
      אבגדהוזחטיכלמנסעפצקרשת
    </div>

    <div class="row hebrew"
         style="font-family:'${font}', sans-serif; font-weight:700;">
      <span class="label">עברית בולד:</span>
      אבגדהוזחטיכלמנסעפצקרשת
    </div>

    <div class="separator"></div>

    <div class="row english"
         style="font-family:'${font}', sans-serif; font-weight:400;">
      <span class="label">אנגלית רגיל:</span>
      ABCDEFGHIJKLMNOPQRSTUVWXYZ
    </div>

    <div class="row english"
         style="font-family:'${font}', sans-serif; font-weight:700;">
      <span class="label">אנגלית בולד:</span>
      ABCDEFGHIJKLMNOPQRSTUVWXYZ
    </div>
  `;

  container.appendChild(block);
});

</script>
